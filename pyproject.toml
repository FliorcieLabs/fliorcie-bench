[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fliorcie-bench"
version = "0.1.0"
description = "Local benchmark records and conformance reports for Fliorcie Community."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Fliorcie Labs"}]
dependencies = []

[project.scripts]
fl-bench = "fliorcie_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

